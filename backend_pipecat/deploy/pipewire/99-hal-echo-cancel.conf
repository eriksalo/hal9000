# HAL 9000 WebRTC echo cancellation for the CMTECK mic + USB speaker.
# Creates a virtual echo-cancelled mic (echo_cancel_source) that HAL captures
# from, and a virtual sink (echo_cancel_sink) that HAL plays TTS to. The module
# subtracts HAL own output from the mic feed and applies AGC plus noise
# suppression, so HAL never hears itself and input arrives at a consistent level.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            capture.props = {
                target.object = "alsa_input.usb-MV-SILICON_CMTECK_20180508-00.analog-stereo"
                node.passive  = true
            }
            source.props = {
                node.name        = "echo_cancel_source"
                node.description = "HAL Echo-Cancelled Mic"
            }
            sink.props = {
                node.name        = "echo_cancel_sink"
                node.description = "HAL Echo-Cancelled Out"
            }
            playback.props = {
                target.object = "alsa_output.usb-GeneralPlus_USB_Audio_Device-00.analog-stereo"
                node.passive  = true
            }
            aec.args = {
                webrtc.gain_control        = true
                webrtc.noise_suppression   = true
                webrtc.high_pass_filter    = true
                webrtc.extended_filter     = true
                webrtc.delay_agnostic      = true
            }
        }
    }
]
